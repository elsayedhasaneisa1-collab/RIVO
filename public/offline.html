<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080a">
<title>RIVO – غير متصل</title>
<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:28px 20px 40px;
    background:radial-gradient(120% 110% at 50% 0%, #101c38 0%, #07080a 62%);
    color:#fff;
    font-family:system-ui, Tahoma, sans-serif;
    text-align:center;
    -webkit-tap-highlight-color:transparent;
  }

  .wrap{margin:auto;width:100%;max-width:520px}

  .scene{
    width:min(300px, 72vw);
    height:auto;
    display:block;
    margin:0 auto -6px;
  }

  h1{
    font-size:clamp(34px, 9vw, 46px);
    letter-spacing:7px;
    margin:4px 0 0;
    font-weight:800;
    background:linear-gradient(180deg, #ffffff 0%, #93aee0 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p{
    color:#9aa3b5;
    line-height:1.8;
    margin:14px auto 0;
    max-width:34ch;
    font-size:15px;
  }

  /* ===== حالة الاتصال ===== */
  .status-card{
    margin:16px auto 0;
    max-width:390px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:11px 15px;
    border-radius:16px;
    background:rgba(255,92,108,.07);
    border:1px solid rgba(255,92,108,.28);
    color:#ffd7db;
    font-size:13px;
    font-weight:700;
  }
  .status-card strong{font-weight:800;color:#fff}
  .pulse-dot{
    flex:0 0 auto;
    width:9px;height:9px;border-radius:50%;
    background:#ff5c6c;
    box-shadow:0 0 0 0 rgba(255,92,108,.65);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,92,108,.65)}
    70%{box-shadow:0 0 0 10px rgba(255,92,108,0)}
    100%{box-shadow:0 0 0 0 rgba(255,92,108,0)}
  }
  .status-icons{display:flex;align-items:center;gap:7px;color:#8ec5ff}
  .status-icons svg{display:block}

  .btn{
    display:inline-block;
    margin-top:24px;
    padding:13px 32px;
    border-radius:14px;
    background:linear-gradient(180deg, #3f7bff, #2f6bff);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    letter-spacing:.4px;
    box-shadow:0 10px 26px -10px #2f6bff, inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 18px 32px -12px #2f6bff, inset 0 1px 0 rgba(255,255,255,.28)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn:focus-visible{outline:3px solid #8ec5ff;outline-offset:3px}

  /* ===== اللعبة ===== */
  .game{
    margin:26px auto 0;
    max-width:420px;
    padding:16px;
    border-radius:20px;
    background:linear-gradient(180deg,#0d1526,#0a0f1b);
    border:1px solid #1e2b45;
    box-shadow:0 20px 50px -30px #000;
    text-align:right;
  }
  .game h2{margin:0 0 4px;font-size:17px;letter-spacing:.3px}
  .game .sub{margin:0;color:#8b95ab;font-size:12.5px;line-height:1.7}

  .hud{
    display:flex;
    gap:8px;
    justify-content:space-between;
    align-items:center;
    margin:12px 0;
    font-size:12px;
    color:#9aa3b5;
  }
  .hud b{color:#fff;font-size:15px}

  .board{
    position:relative;
    width:100%;
    max-width:340px;
    aspect-ratio:1/1;
    margin:0 auto;
    border-radius:16px;
    background:radial-gradient(circle at 50% 40%,#0e2038,#070b14 75%);
    border:1px solid #1e2b45;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  canvas{display:block;width:100%;height:100%}

  .overlay{
    position:absolute;
    inset:0;
    z-index:3;
    display:grid;
    place-items:center;
    gap:10px;
    background:rgba(7,8,10,.6);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    padding:16px;
    text-align:center;
  }
  .overlay p{margin:0;color:#fff;font-weight:700;font-size:14px;line-height:1.7}
  .hidden{display:none !important}

  .game-btn{
    border:0;
    padding:12px 26px;
    border-radius:14px;
    background:linear-gradient(180deg,#3f7bff,#2f6bff);
    color:#fff;
    font:inherit;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 10px 24px -12px #2f6bff, inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .16s ease, filter .16s ease;
  }
  .game-btn:hover{filter:brightness(1.08)}
  .game-btn:active{transform:scale(.97)}
  .game-btn:focus-visible{outline:3px solid #8ec5ff;outline-offset:3px}

  .hint{
    margin:10px 0 0;
    color:#6b7a94;
    font-size:11.5px;
    text-align:center;
  }

  /* ===== أنميشن الشخصية ===== */
  @keyframes float{
    0%,100%{transform:translateY(-5px)}
    50%    {transform:translateY(5px)}
  }
  @keyframes shake{
    0%,100%{transform:rotate(-2.5deg)}
    50%    {transform:rotate(2.5deg)}
  }
  @keyframes blink{
    0%,90%,100%{transform:scaleY(1)}
    94%        {transform:scaleY(.08)}
  }
  @keyframes crackPulse{
    0%,100%{opacity:.35}
    50%    {opacity:1}
  }
  @keyframes spark{
    0%,100%{opacity:0; transform:scale(.35) rotate(0deg)}
    40%    {opacity:1; transform:scale(1)   rotate(45deg)}
    70%    {opacity:0; transform:scale(.6)  rotate(90deg)}
  }
  @keyframes tear{
    0%  {opacity:0; transform:translateY(0)}
    15% {opacity:1; transform:translateY(4px)}
    70% {opacity:1; transform:translateY(30px)}
    100%{opacity:0; transform:translateY(44px)}
  }

  .float{animation:float 3.4s ease-in-out infinite}
  .phone{transform-box:fill-box;transform-origin:50% 88%;animation:shake 1.9s ease-in-out infinite}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s ease-in-out infinite}
  .cracks{animation:crackPulse 2.2s ease-in-out infinite}
  .spark{transform-box:fill-box;transform-origin:center;animation:spark 2.7s ease-in-out infinite}
  .s2{animation-delay:.9s}
  .s3{animation-delay:1.7s}
  .tear{transform-box:fill-box;transform-origin:center;animation:tear 3.8s ease-in infinite}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important}
  }
</style>
</head>
<body>
  <div class="wrap">

    <svg class="scene" viewBox="0 0 320 380" role="img"
         aria-label="شخصية تحمل هاتفًا مكسورًا وشاشته تعرض عدم وجود اتصال بالإنترنت">

        </linearGradient>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#2f6bff" stop-opacity=".35"/>

      </defs>

      <circle cx="160" cy="180" r="150" fill="url(#glow)"/>
      <ellipse cx="160" cy="356" rx="74" ry="11" fill="#000" opacity=".55"/>

      <g class="float">
        <rect x="146" y="166" width="28" height="36" rx="12" fill="#d8a87f"/>

        <path d="M108 348 L108 252 Q108 198 160 198 Q212 198 212 252 L212 348 Z"
              fill="url(#hoodie)" stroke="#3a4d74" stroke-width="2"/>

        <circle cx="160" cy="134" r="46" fill="#f2c9a0"/>

        <path d="M113 132 Q113 84 160 84 Q207 84 207 132
                 Q196 110 160 108 Q124 110 113 132 Z" fill="#232c42"/>

        <path d="M134 122 L152 115" stroke="#232c42" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M168 115 L186 122" stroke="#232c42" stroke-width="3.5" stroke-linecap="round"/>

        <circle class="eye" cx="144" cy="134" r="5.5" fill="#1b2233"/>
        <circle class="eye" cx="176" cy="134" r="5.5" fill="#1b2233"/>

        <path d="M149 159 Q160 150 171 159"
              stroke="#1b2233" stroke-width="4" stroke-linecap="round" fill="none"/>

        <ellipse class="tear" cx="178" cy="146" rx="3.4" ry="4.6" fill="#8ec5ff"/>

        <path d="M114 232 Q96 270 122 290"
              stroke="#2b3d63" stroke-width="18" stroke-linecap="round" fill="none"/>
        <path d="M206 232 Q224 270 198 290"
              stroke="#2b3d63" stroke-width="18" stroke-linecap="round" fill="none"/>

        <g class="phone">
          <rect x="124" y="222" width="72" height="122" rx="14"
                fill="#0e1727" stroke="#3d4c6b" stroke-width="3"/>
          <rect x="131" y="234" width="58" height="98" rx="8" fill="url(#screen)"/>
          <rect x="150" y="227" width="20" height="4" rx="2" fill="#3d4c6b"/>

          <g stroke="#ff5c6c" stroke-width="2.2" fill="none"
             stroke-linecap="round" opacity=".95">
            <path d="M148 266 Q160 257 172 266"/>
            <path d="M153 273 Q160 267 167 273"/>
            <circle cx="160" cy="280" r="1.7" fill="#ff5c6c" stroke="none"/>
            <path d="M146 256 L174 286"/>
          </g>

          <g class="cracks" stroke="#8ec5ff" stroke-width="2" fill="none"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M138 246 L155 264 L145 278 L160 296"/>
            <path d="M155 264 L177 254"/>
            <path d="M145 278 L134 287"/>
            <path d="M160 296 L174 308 L186 294"/>
            <path d="M166 250 L178 268"/>
            <path d="M138 246 L133 239"/>
          </g>
        </g>

        <circle cx="122" cy="290" r="11" fill="#f2c9a0"/>
        <circle cx="198" cy="290" r="11" fill="#f2c9a0"/>
      </g>

      <g transform="translate(112,226)">
        <g class="spark s1">
          <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#8ec5ff"/>
        </g>
      </g>
      <g transform="translate(208,252)">
        <g class="spark s2">
          <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#8ec5ff"/>
        </g>
      </g>
      <g transform="translate(106,306)">
        <g class="spark s3">
          <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#8ec5ff"/>
        </g>
      </g>
    </svg>

    <h1>RIVO</h1>

    <div class="status-card" role="status" aria-live="polite">
      <span class="pulse-dot" aria-hidden="true"></span>
      <strong>لا يوجد اتصال بالإنترنت</strong>
      <span class="status-icons" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <rect x="2" y="14" width="3" height="6" rx="1"/>
          <rect x="7" y="11" width="3" height="9" rx="1"/>
          <rect x="12" y="8" width="3" height="12" rx="1"/>
          <rect x="17" y="5" width="3" height="15" rx="1"/>
          <path d="M3 3 L21 21" stroke="#ff5c6c" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M2 8.5C7.5 3 16.5 3 22 8.5"/>
          <path d="M5.5 12.5C9 8.5 15 8.5 18.5 12.5"/>
          <path d="M9 16.5C10.7 14.7 13.3 14.7 15 16.5"/>
          <circle cx="12" cy="20" r="1.6" fill="currentColor" stroke="none"/>
          <path d="M3 3 L21 21" stroke="#ff5c6c" stroke-width="2.6"/>
        </svg>
      </span>
    </div>

    <p>أنت غير متصل بالإنترنت حاليًا. تحقق من الاتصال وحاول مرة أخرى.</p>

    <section class="game" aria-labelledby="gameTitle">
      <h2 id="gameTitle">لعبة الثعبان</h2>
      <p class="sub">كُل النقاط الحمراء. تمرّ من الحواف إلى الجهة الأخرى، لكن احذر أن تعضّ جسمك.</p>

      <div class="hud" aria-live="polite">
        <span>النقاط: <b id="score">0</b></span>
        <span>الأفضل: <b id="best">0</b></span>
      </div>

      <div id="board" class="board" aria-label="لوحة لعبة الثعبان">
        <canvas id="snakeCanvas"></canvas>
        <div id="startOverlay" class="overlay">
          <button id="startBtn" class="game-btn" type="button">ابدأ اللعب</button>
        </div>
        <div id="endOverlay" class="overlay hidden">
          <p id="endText">انتهت اللعبة!</p>
          <button id="againBtn" class="game-btn" type="button">العب مرة أخرى</button>
        </div>
      </div>

      <p class="hint">اسحب على اللوحة أو استخدم الأسهم / WASD</p>
    </section>

    <a class="btn" href="/">إعادة المحاولة</a>
  </div>

  <script>
    (function () {
      const GRID = 15;

      const board = document.getElementById('board');
      const canvas = document.getElementById('snakeCanvas');
      const ctx = canvas.getContext('2d');

      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const startOverlay = document.getElementById('startOverlay');
      const endOverlay = document.getElementById('endOverlay');
      const endText = document.getElementById('endText');
      const startBtn = document.getElementById('startBtn');
      const againBtn = document.getElementById('againBtn');

      const BEST_KEY = 'rivo-snake-best';

      let cell = 20;
      let snake = [{x:6,y:7},{x:5,y:7},{x:4,y:7}];
      let dir = {x:1,y:0};
      let nextDir = {x:1,y:0};
      let food = {x:10,y:7};
      let score = 0;
      let running = false;
      let tickMs = 160;
      let lastTick = 0;
      let rafId = 0;

      let best = 0;
      try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (_) {}
      bestEl.textContent = best;

      function fitCanvas() {
        const size = board.clientWidth;
        if (!size) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cell = size / GRID;
        draw();
      }

      function resetGame() {
        snake = [{x:6,y:7},{x:5,y:7},{x:4,y:7}];
        dir = {x:1,y:0};
        nextDir = {x:1,y:0};
        score = 0;
        tickMs = 160;
        scoreEl.textContent = '0';
        spawnFood();
      }

      function spawnFood() {
        const occupied = new Set(snake.map(s => s.x + ',' + s.y));
        const empty = [];
        for (let y = 0; y < GRID; y++) {
          for (let x = 0; x < GRID; x++) {
            if (!occupied.has(x + ',' + y)) empty.push({x, y});
          }
        }
        food = empty.length ? empty[Math.floor(Math.random() * empty.length)] : null;
      }

      function setDir(d) {
        if (!running) return;
        if (d.x === -dir.x && d.y === -dir.y) return;
        if (d.x === dir.x && d.y === dir.y) return;
        nextDir = d;
      }

      function step() {
        if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) {
          dir = nextDir;
        }
        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

        // الالتفاف حول الحواف بدل الموت
        if (head.x < 0) head.x = GRID - 1;
        else if (head.x >= GRID) head.x = 0;
        if (head.y < 0) head.y = GRID - 1;
        else if (head.y >= GRID) head.y = 0;

        // الموت فقط عند عضّ الجسم
        for (let i = 0; i < snake.length - 1; i++) {
          if (snake[i].x === head.x && snake[i].y === head.y) {
            return endGame();
          }
        }

        snake.unshift(head);

        if (food && head.x === food.x && head.y === food.y) {
          score++;
          scoreEl.textContent = score;
          tickMs = Math.max(70, tickMs - 4);
          spawnFood();
        } else {
          snake.pop();
        }
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function draw() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(142,197,255,0.05)';
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          const p = i * cell;
          ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
        }

        if (food) {
          const now = performance.now();
          const pulse = 0.85 + 0.15 * Math.sin(now / 220);
          const cx = food.x * cell + cell / 2;
          const cy = food.y * cell + cell / 2;
          const r = cell * 0.3 * pulse;

          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 0.95);
          grad.addColorStop(0, 'rgba(255,107,107,0.55)');
          grad.addColorStop(1, 'rgba(255,107,107,0)');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(cx, cy, cell * 0.95, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = '#ff6b6b';
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.32, 0, Math.PI * 2); ctx.fill();
        }

        for (let i = snake.length - 1; i >= 0; i--) {
          const seg = snake[i];
          const t = snake.length > 1 ? i / (snake.length - 1) : 0;
          const alpha = 0.42 + 0.58 * (1 - t);
          const pad = cell * 0.06;
          const size = cell - pad * 2;

          ctx.fillStyle = 'rgba(47,107,255,' + alpha.toFixed(3) + ')';
          roundRect(seg.x * cell + pad, seg.y * cell + pad, size, size, cell * 0.28);
          ctx.fill();

          if (i === 0) {
            ctx.strokeStyle = 'rgba(142,197,255,0.9)';
            ctx.lineWidth = Math.max(1, cell * 0.06);
            ctx.stroke();
          }
        }

        if (snake.length) {
          const head = snake[0];
          const hx = head.x * cell + cell / 2;
          const hy = head.y * cell + cell / 2;
          const eyeOff = cell * 0.17;
          const perpX = -dir.y, perpY = dir.x;
          const fwdX = dir.x, fwdY = dir.y;

          const ex1 = hx + perpX * eyeOff + fwdX * eyeOff * 0.7;
          const ey1 = hy + perpY * eyeOff + fwdY * eyeOff * 0.7;
          const ex2 = hx - perpX * eyeOff + fwdX * eyeOff * 0.7;
          const ey2 = hy - perpY * eyeOff + fwdY * eyeOff * 0.7;

          ctx.fillStyle = '#08101f';
          ctx.beginPath(); ctx.arc(ex1, ey1, cell * 0.09, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey2, cell * 0.09, 0, Math.PI * 2); ctx.fill();
        }
      }

      function loop(t) {
        if (!running) return;
        if (t - lastTick >= tickMs) {
          lastTick = t;
          step();
        }
        draw();
        if (running) rafId = requestAnimationFrame(loop);
      }

      function start() {
        resetGame();
        fitCanvas();
        startOverlay.classList.add('hidden');
        endOverlay.classList.add('hidden');
        running = true;
        lastTick = performance.now();
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(loop);
      }

      function endGame() {
        running = false;
        cancelAnimationFrame(rafId);
        if (score > best) {
          best = score;
          try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
        }
        bestEl.textContent = best;
        endText.textContent = 'انتهت اللعبة! نقاطك: ' + score;
        endOverlay.classList.remove('hidden');
      }

      window.addEventListener('keydown', function (e) {
        const k = e.key;
        let d = null;
        if (k === 'ArrowUp' || k === 'w' || k === 'W') d = {x:0, y:-1};
        else if (k === 'ArrowDown' || k === 's' || k === 'S') d = {x:0, y:1};
        else if (k === 'ArrowLeft' || k === 'a' || k === 'A') d = {x:-1, y:0};
        else if (k === 'ArrowRight' || k === 'd' || k === 'D') d = {x:1, y:0};
        if (!d) return;
        if (running) e.preventDefault();
        setDir(d);
      }, { passive: false });

      let touchStart = null;
      board.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) {
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      }, { passive: true });

      board.addEventListener('touchmove', function (e) {
        if (!touchStart || e.touches.length !== 1) return;
        const t = e.touches[0];
        const dx = t.clientX - touchStart.x;
        const dy = t.clientY - touchStart.y;
        if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          setDir(dx > 0 ? {x:1, y:0} : {x:-1, y:0});
        } else {
          setDir(dy > 0 ? {x:0, y:1} : {x:0, y:-1});
        }
        touchStart = { x: t.clientX, y: t.clientY };
      }, { passive: true });

      board.addEventListener('touchend', function () {
        touchStart = null;
      }, { passive: true });

      startBtn.addEventListener('click', start);
      againBtn.addEventListener('click', start);

      if ('ResizeObserver' in window) {
        new ResizeObserver(fitCanvas).observe(board);
      } else {
        window.addEventListener('resize', fitCanvas);
      }

      requestAnimationFrame(function () {
        fitCanvas();
        draw();
      });
    })();
  </script>
</body>
</html>
